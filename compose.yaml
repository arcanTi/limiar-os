name: limiar-os

services:
  postgres:
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_DB: limiar
      POSTGRES_USER: limiar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - limiar-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiar -d limiar"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build: .
    # Opt-in only. `docker compose up` must NOT start this service: the image
    # bakes `dist/` in at build time, so it serves whatever bundle it was built
    # with while the host keeps rebuilding a `dist/` it never reads. Worse, it
    # publishes on 0.0.0.0:8765 while the native run (`./run-local.sh`) binds
    # 127.0.0.1:8765 — both start without error, and which one answers depends
    # on whether the client resolved `localhost` to IPv4 or IPv6. Two builds,
    # two databases, one URL.
    #
    # The deployment itself still works and is still supported:
    #   docker compose --profile deploy up --build
    # Stop the native server first; `--build` is required or you ship a stale UI.
    profiles: ["deploy"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      LIMIAR_DATABASE_URL: postgresql+psycopg://limiar:${POSTGRES_PASSWORD}@postgres:5432/limiar
      LIMIAR_GM_USER: ${LIMIAR_GM_USER:-mestre}
      # Optional: pin the master access token. Left unset, one is generated on
      # first boot and written to the container log.
      LIMIAR_MASTER_TOKEN: ${LIMIAR_MASTER_TOKEN:-}
      LIMIAR_SESSION_TTL: ${LIMIAR_SESSION_TTL:-28800}
      LIMIAR_SESSION_TOUCH_INTERVAL: ${LIMIAR_SESSION_TOUCH_INTERVAL:-900}
      LIMIAR_MAX_UPLOAD_MB: ${LIMIAR_MAX_UPLOAD_MB:-64}
    ports:
      - "${LIMIAR_PORT:-8765}:8765"
    volumes:
      - limiar-uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # This is the only PostgreSQL data store. `docker compose down --volumes`
  # intentionally destroys it; there is no SQLite import or hidden DB volume.
  limiar-postgres:
  limiar-uploads:
