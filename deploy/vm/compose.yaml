name: limiar-os

services:
  postgres:
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_DB: limiar
      POSTGRES_USER: limiar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - limiar-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiar -d limiar"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  app:
    image: ${LIMIAR_IMAGE:?deploy using an immutable GHCR digest}
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      LIMIAR_DATABASE_URL: postgresql+psycopg://limiar:${POSTGRES_PASSWORD}@postgres:5432/limiar
      LIMIAR_GM_USER: ${LIMIAR_GM_USER:-mestre}
      LIMIAR_GM_PASSWORD: ${LIMIAR_GM_PASSWORD:?define LIMIAR_GM_PASSWORD}
      LIMIAR_SESSION_TTL: ${LIMIAR_SESSION_TTL:-28800}
      LIMIAR_SESSION_TOUCH_INTERVAL: ${LIMIAR_SESSION_TOUCH_INTERVAL:-900}
      LIMIAR_MAX_UPLOAD_MB: ${LIMIAR_MAX_UPLOAD_MB:-64}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${LIMIAR_PORT:-8765}:8765"
    volumes:
      - limiar-uploads:/app/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  limiar-postgres:
  limiar-uploads:
