name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer PR run supersedes an older one. A production run must never be
  # interrupted halfway through a deployment by a subsequent push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-repository-hygiene.py
      - name: Verify Python locks are current for Linux
        run: |
          ./scripts/compile-python-locks.sh
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - run: git diff --check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  backend:
    name: Backend · Python 3.13 · PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: limiar_test
          POSTGRES_USER: limiar_test
          POSTGRES_PASSWORD: limiar_test_password
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limiar_test -d limiar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LIMIAR_DATABASE_URL: postgresql+psycopg://limiar_test:limiar_test_password@127.0.0.1:5432/limiar_test
      LIMIAR_TEST_DATABASE_URL: postgresql+psycopg://limiar_test:limiar_test_password@127.0.0.1:5432/limiar_test
      LIMIAR_GM_PASSWORD: ci-only-admin-password
      LIMIAR_FAIL_ON_SKIP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Verify dependency lock
        run: python -m pip check
      - name: Empty database migration
        run: python -m alembic upgrade head
      - name: Architecture boundaries
        run: python scripts/check-architecture.py
      - name: Ruff regression baseline
        run: python scripts/ruff-baseline.py
      - name: Backend suite with zero skips and coverage
        run: >-
          python -m pytest backend/tests -q
          --cov=backend
          --cov-report=term-missing:skip-covered
          --cov-report=json:backend-coverage.json
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend-coverage.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Canonical domain verification
        run: sh scripts/verify-domain-catalogs.sh
      # Coverage runs the full Vitest suite; a separate `npm test` would execute
      # the same 763 tests twice.
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container build and smoke
    needs:
      - hygiene
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: >-
          docker build --pull
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --tag limiar-os:ci .
      - name: Create smoke network
        run: docker network create limiar-ci
      - name: Start PostgreSQL
        run: >-
          docker run --detach --name limiar-ci-postgres
          --network limiar-ci
          --network-alias postgres
          --env POSTGRES_DB=limiar
          --env POSTGRES_USER=limiar
          --env POSTGRES_PASSWORD=limiar_ci_password
          postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            if docker exec limiar-ci-postgres pg_isready -U limiar -d limiar; then
              exit 0
            fi
            sleep 2
          done
          docker logs limiar-ci-postgres
          exit 1
      - name: Start application
        run: >-
          docker run --detach --name limiar-ci-app
          --network limiar-ci
          --publish 8765:8765
          --env LIMIAR_DATABASE_URL=postgresql+psycopg://limiar:limiar_ci_password@postgres:5432/limiar
          --env LIMIAR_GM_PASSWORD=ci-only-admin-password
          limiar-os:ci
      - name: Smoke HTTP surfaces
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs limiar-ci-app
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/login.html
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/campaign-map.html
      - name: Authenticate to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          immutable_tag="${repository}:${GITHUB_SHA}"
          docker tag limiar-os:ci "$immutable_tag"
          push_output=$(docker push "$immutable_tag")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' | tail -1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker tag limiar-os:ci "${repository}:main"
          docker push "${repository}:main"
          {
            echo "repository=$repository"
            echo "digest=$digest"
            echo "image=${repository}@${digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Container logs
        if: always()
        run: |
          docker logs limiar-ci-app 2>&1 || true
          docker logs limiar-ci-postgres 2>&1 || true
      - name: Stop containers
        if: always()
        run: |
          docker rm --force limiar-ci-app limiar-ci-postgres 2>/dev/null || true
          docker network rm limiar-ci 2>/dev/null || true

  deploy-production:
    name: Deploy · Proxmox VM
    needs:
      - container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.LIMIAR_PUBLIC_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy immutable image over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LIMIAR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LIMIAR_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.LIMIAR_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.LIMIAR_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.LIMIAR_DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.LIMIAR_DEPLOY_PATH || '/opt/limiar-os' }}
          IMAGE_REF: ${{ needs.container.outputs.image }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?missing LIMIAR_DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing LIMIAR_DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing LIMIAR_DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing LIMIAR_DEPLOY_KNOWN_HOSTS}"
          : "${IMAGE_REF:?container job did not publish an image}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]

          key_file="$RUNNER_TEMP/limiar_deploy_key"
          known_hosts_file="$RUNNER_TEMP/limiar_known_hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          incoming_dir="${DEPLOY_PATH}/incoming/${GITHUB_SHA}"
          ssh_options=(-i "$key_file" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file")
          printf -v prepare_command 'mkdir -p %q' "$incoming_dir"
          # Expansion is intentionally local: printf %q constructs the quoted remote command.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "$prepare_command"
          scp -q -i "$key_file" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            deploy/vm/compose.yaml deploy/vm/deploy.sh "$target:$incoming_dir/"
          printf -v deploy_command 'chmod 700 %q && %q %q %q %q' \
            "$incoming_dir/deploy.sh" "$incoming_dir/deploy.sh" "$IMAGE_REF" "$DEPLOY_PATH" "$GITHUB_SHA"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "$deploy_command"
      - name: External production smoke
        env:
          PUBLIC_URL: ${{ vars.LIMIAR_PUBLIC_URL }}
        run: |
          : "${PUBLIC_URL:?missing LIMIAR_PUBLIC_URL}"
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${PUBLIC_URL%/}/api/health"
