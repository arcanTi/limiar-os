name: limiar-os-test

services:
  postgres-test:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: limiar_test
      POSTGRES_USER: limiar_test
      POSTGRES_PASSWORD: limiar_test_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiar_test -d limiar_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
